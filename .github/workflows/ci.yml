name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python (.python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Smoke run (empty app creates config and log)
        shell: bash
        run: |
          uv run hwpcal --data-dir "$RUNNER_TEMP/hwpcal-smoke"
          uv run python - <<'PY'
          import os
          from pathlib import Path

          data_dir = Path(os.environ["RUNNER_TEMP"]) / "hwpcal-smoke"
          config = data_dir / "config.json"
          log = data_dir / "logs" / "hwpcal.log"
          assert config.is_file(), f"missing {config}"
          assert log.is_file() and log.stat().st_size > 0, f"missing or empty {log}"
          print("smoke ok:", data_dir)
          print(config.read_text(encoding="utf-8"))
          PY
