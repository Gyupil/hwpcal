[project]
name = "hwpcal"
version = "0.1.0"
description = "HWP 일정표 파일을 감시해 Google Calendar에 변경분만 자동 반영하는 트레이 앱"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gyupil" }]
dependencies = [
    "pydantic>=2.7",
    "platformdirs>=4.2",
    # Windows에는 시스템 시간대 DB가 없어 zoneinfo("Asia/Seoul")에 tzdata가 필요하다.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
hwpcal = "hwpcal.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwpcal"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: 여러 구성 요소를 함께 검증하는 통합 테스트",
    "real_api: 실제 Google API를 호출하는 테스트 (--real-api 옵션 없으면 건너뜀)",
]

[tool.coverage.run]
source = ["hwpcal"]
branch = true

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["hwpcal", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib 사용
    "PT",       # pytest 스타일
    "RET",      # return 정리
    "PIE",
    "ISC",
    "RUF",
]
ignore = ["ISC001"]  # 포매터와 충돌

[tool.ruff.lint.isort]
known-first-party = ["hwpcal"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
files = ["hwpcal", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
